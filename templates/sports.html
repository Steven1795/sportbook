{% extends "base.html" %}{% block title %}Jenis Olahraga{% endblock %}{% block content %}
<h2 class="fw-bold mb-3">Master Jenis Olahraga</h2><div class="card p-3 mb-3"><form method="post" action="/sports" class="row g-2"><div class="col-md-4"><input class="form-control" name="name" placeholder="Nama olahraga" required></div><div class="col-md-6"><input class="form-control" name="description" placeholder="Deskripsi"></div><div class="col-md-2"><button class="btn btn-primary w-100">Tambah</button></div></form></div>
<div class="card p-3"><table class="table"><thead><tr><th>Nama</th><th>Deskripsi</th><th>Aksi</th></tr></thead><tbody>{% for s in sports %}<tr><td>{{ s.name }}</td><td>{{ s.description or '-' }}</td><td><form method="post" action="/sports/{{ s.id }}/delete" onsubmit="return confirm('Hapus jenis olahraga?')"><button class="btn btn-sm btn-outline-danger">Hapus</button></form></td></tr>{% else %}<tr><td colspan="3">Belum ada data.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
