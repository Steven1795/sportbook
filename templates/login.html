{% extends "base.html" %}{% block title %}Login - SportBook{% endblock %}{% block content %}
<div class="auth-card card shadow-sm mx-auto p-4"><h3 class="fw-bold">Selamat datang!</h3><p class="text-secondary">Login ke akun SportBook.</p>
<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form>
<p class="mt-3 mb-0 text-center">Belum punya akun? <a href="/register">Register</a></p><hr><small class="text-secondary">Admin demo: admin@sportbook.com / admin123</small></div>{% endblock %}
