{% extends "base.html" %}{% block title %}Register - SportBook{% endblock %}{% block content %}
<div class="auth-card card shadow-sm mx-auto p-4"><h3 class="fw-bold">Buat akun</h3><p class="text-secondary">Daftar sebagai pelanggan SportBook.</p>
<form method="post"><label class="form-label">Nama lengkap</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (minimal 6 karakter)</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
<button class="btn btn-primary w-100">Register</button></form><p class="mt-3 mb-0 text-center">Sudah punya akun? <a href="/login">Login</a></p></div>{% endblock %}
